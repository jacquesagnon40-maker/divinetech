<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Divinetech">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

    <meta name="google-site-verification" content="1zMEAHvLnA0VKlvMVbbROrBMKA1Zak3N_9Watsn3oTE" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eaf1ff">
    <link rel="manifest" href="manifest.json">
    <title>Divinetech - Gestion</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>

    <!-- ACCUEIL -->
    <section id="accueil" class="screen welcome-screen">
        <div class="welcome-card">
            <img src="logo_divinetech.jpg" alt="Divinetech" class="logo">
            <h1>Bienvenue chez Divinetech</h1>
            <p>Votre espace professionnel de gestion informatique</p>
            <button class="primary-btn" onclick="showScreen('connexion')">
                COMMENCER <span>→</span>
            </button>
        </div>
    </section>

    <!-- CONNEXION -->
    <section id="connexion" class="screen auth-screen hidden">
        <div class="auth-card">
            <button class="back-btn" onclick="showScreen('accueil')">← Retour</button>
            <h1>Bienvenue</h1>
            <p class="subtitle">Connectez-vous à votre espace</p>

            <form id="loginForm">
                <input id="loginEmail" type="email" placeholder="Adresse e-mail" required>
                <div class="password-box">
    <input id="loginPassword" type="password" placeholder="Mot de passe" required>
    <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">👁</button>
</div>
                <div class="form-options">
                    <label><input type="checkbox" id="rememberMe"> Se souvenir de moi</label>
                    <a href="#" onclick="forgotPassword(event)">Mot de passe oublié ?</a>
                </div>
                <button class="primary-btn" type="submit">SE CONNECTER →</button>
            </form>
<button
    class="primary-btn"
    type="button"
    onclick="showScreen('inscription')">
    S'INSCRIRE →
</button>
        </div>
    </section>

       <section id="inscription" class="screen auth-screen hidden">
    <div class="auth-card">
            <button class="back-btn" onclick="showScreen('accueil')">← Retour</button>
            <h1>Créer un compte</h1>
            <p class="subtitle">Rejoignez votre espace Divinetech</p>

            <form id="registerForm">
                <input id="registerName" type="text" placeholder="Nom complet" required>
                <input id="registerPhone" type="tel" placeholder="Téléphone" required>
                <input id="registerEmail" type="email" placeholder="Adresse e-mail" required>
                <div class="password-box">
    <input id="registerPassword" type="password" placeholder="Mot de passe (6 caractères minimum)" minlength="6" required>
    <button type="button" class="toggle-password" onclick="togglePassword('registerPassword', this)">👁</button>
</div>

<div class="password-box">
    <input id="registerConfirm" type="password" placeholder="Confirmer le mot de passe" required>
    <button type="button" class="toggle-password" onclick="togglePassword('registerConfirm', this)">👁</button>
</div>
                <button class="primary-btn" type="submit">CRÉER MON COMPTE →</button>
            </form>

            <p class="switch-auth">Déjà inscrit ?
                <a href="#" onclick="showScreen('connexion')">Se connecter</a>
            </p>
        </div>
    </section>

    <!-- APPLICATION -->
    <section id="application" class="screen app-screen hidden">
        <aside class="sidebar">
            <div class="brand">
                <img src="logo_divinetech.jpg" alt="Logo Divinetech">
                <strong>DIVINETECH</strong>
            </div>

            <nav>
                <button onclick="showPage('dashboard')" class="nav-btn active">⌂ Accueil</button>
                <button onclick="showPage('clients')" class="nav-btn">♙ Clients</button>
                <button onclick="showPage('ordinateurs')" class="nav-btn">▣ Ordinateurs</button>
                <button onclick="showPage('ventes')" class="nav-btn">▤ Ventes</button>
                <button onclick="showPage('maintenance')" class="nav-btn">⚙ Maintenance</button>
                <button onclick="showPage('stocks')" class="nav-btn">▥ Stocks</button>
            </nav>

            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <h2 id="pageTitle">Tableau de bord</h2>
                    <p id="userWelcome">Bienvenue dans votre espace</p>
                </div>
                <span class="user-avatar" id="userInitial">D</span>
            </header>

            <div id="pageContent"></div>
        </main>
    </section>

    <div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
